<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS : seul moyen d'obtenir un vrai plein écran sans barre Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Toom" />
    <meta name="theme-color" content="#c8102e" />
    <title>Toom — We'll see tomorrow</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #c8102e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        z-index: 9999;
      }
      #splash img {
        width: min(38vw, 160px);
        height: min(38vw, 160px);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash span {
        font-family: "Rockwell", "Roboto Condensed", sans-serif;
        font-style: italic;
        color: #fff;
        font-size: 0.95rem;
        opacity: 0.9;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <img src="/brand/icon-512.png" alt="Toom" />
        <span>We'll see tomorrow</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
